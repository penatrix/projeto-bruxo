services:
  db:
    image: mariadb:11
    container_name: otb-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Compila o engine. Roda sob demanda: docker compose run --rm build
  build:
    build:
      context: ./docker
    image: otb/toolchain:latest
    container_name: otb-build
    profiles: ["tools"]
    working_dir: /srv
    volumes:
      - ./server:/srv
      - ccache:/root/.ccache
    entrypoint: ["/usr/local/bin/build.sh"]

  # Roda o servidor. Usa o binário compilado pelo serviço acima.
  server:
    build:
      context: ./docker
    image: otb/toolchain:latest
    container_name: otb-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /srv
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_NAME: ${SERVER_NAME}
      SERVER_IP: ${SERVER_IP}
      SERVER_MOTD: ${SERVER_MOTD}
    volumes:
      - ./server:/srv
    ports:
      - "7171:7171"
      - "7172:7172"
    stdin_open: true
    tty: true

  # Cliente web pro banco. http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: otb-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    # A imagem escuta em [::]:8080 por padrão e morre em host sem IPv6.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]

volumes:
  db-data:
  ccache:
